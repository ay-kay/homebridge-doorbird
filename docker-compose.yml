# Homebridge with homebridge-doorbird as its only plugin.
#
# Copy docker/config.example.json to docker/data/config.json and fill in your Doorbird, then: docker compose up -d
services:
  homebridge-doorbird:
    build: .
    image: homebridge-doorbird
    container_name: homebridge-doorbird
    restart: unless-stopped
    # HomeKit needs mDNS and the stream uses random UDP ports, so bridged Docker networking won't work.
    network_mode: host
    environment:
      - TZ=Europe/Berlin
    volumes:
      - ./docker/data:/data
