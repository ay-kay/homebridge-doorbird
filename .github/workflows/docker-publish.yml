# Build the Docker image (Homebridge with this plugin only) and publish it to the GitHub Container Registry.
#
# Pushes to master publish ghcr.io/<owner>/<repo>:master and :latest, version tags publish :X.Y.Z. Pull requests only build the image.
name: "Docker Publish"

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

jobs:
  docker-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout the repository.
      uses: actions/checkout@v4

    - name: Setup Docker Buildx.
      uses: docker/setup-buildx-action@v3

    - name: Login to the GitHub Container Registry.
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Determine the image tags.
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=raw,value=latest,enable={{is_default_branch}}

    # amd64 only: Proxmox and most home servers. The bundled FFmpeg is downloaded for the architecture the image is built for.
    - name: Build and publish the image.
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
